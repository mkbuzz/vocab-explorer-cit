name: Sync U4 vocabulary 52

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/sync_u4_vocab_52.py'
      - '.github/workflows/sync-u4-vocab-52.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Sync revised U4 vocabulary
        run: python .github/scripts/sync_u4_vocab_52.py
      - name: Commit updated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync Unit 4 vocabulary to 52 items"
          git push
